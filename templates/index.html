<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Management Quiz</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="quiz-container">
        <div id="setup-view">
            <h1>Disaster Management Quiz 🌪️</h1>
            <p>Select your preferences to start the quiz.</p>
            <form id="quiz-setup-form">
                <div class="form-group">
                    <label for="disaster-type">Choose a Disaster Type:</label>
                    <select id="disaster-type" name="disaster-type">
                        <option value="Earthquake">Earthquake</option>
                        <option value="Flood">Flood</option>
                        <option value="Fire">Fire</option>
                        <option value="Tornado">Tornado</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="standard">Choose Your Standard:</label>
                    <select id="standard" name="standard">
                        <option value="5th">5th</option>
                        <option value="8th">8th</option>
                        <option value="10th">10th</option>
                        <option value="12th">12th</option>
                        <option value="Above 12th">Above 12th</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="age">Enter Your Age:</label>
                    <input type="number" id="age" name="age" min="5" max="100" required value="15">
                </div>
                <button type="submit" id="start-btn">Start Quiz</button>
            </form>
        </div>
        <div id="quiz-view" class="hidden">
            <div id="quiz-header">
                <span id="question-counter"></span>
                <span id="score-display">Score: 0</span>
            </div>
            <h2 id="question-text">This is where the question text will go.</h2>
            <div id="options-container"></div>
            <p id="feedback"></p>
        </div>
        <div id="results-view" class="hidden">
            <h2>Quiz Complete! ✨</h2>
            <p>Well done! Here are your results.</p>
            <p id="final-score">Your final score is: 500</p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
